name: Auto-rebuild dist

on:
  push:
    branches:
      - 'renovate/**'
    paths:
      - 'package.json'
      - 'package-lock.json'

permissions:
  contents: write

jobs:
  rebuild:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          ref: ${{ github.ref }}

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        run: npm clean-install

      - name: Rebuild dist bundle
        run: npm run build

      - name: Commit updated dist if changed
        run: |
          if [ -n "$(git diff --name-only dist/)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add dist/
            git commit -m "build: recompile dist after dependency update"
            git push
            echo "dist/ was out of date — committed rebuild."
          else
            echo "dist/ is already up to date."
          fi
